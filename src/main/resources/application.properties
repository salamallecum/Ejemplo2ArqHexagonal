spring.application.name=ApiEstudiantesArqHexagonal

#DATOS BASE DE DATOS
spring.datasource.url=jdbc:mysql://localhost:3306/hexagonal
spring.datasource.username=root
spring.datasource.password=

#CONFIGURACION HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#CONFIGURACION LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Ruta documentacion swagger: http://localhost:8080/swagger-ui/index.html
#Ruta documentacion api-docs: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui 
#CON ESTO EVITAMOS QUE SWAGGER COLOQUE RESPUESTAS GENERICAS EN LA DOCUMENTACION
springdoc.override-with-generic-response=false
